name: Release

# How a release happens:
#   1. You merge work to main with Conventional Commit messages (feat:, fix:, ...).
#   2. Release Please opens or updates a release pull request. It bumps the version
#      in package.json and writes CHANGELOG.md.
#   3. You review and merge that pull request. Release Please tags the commit and
#      creates a GitHub release.
#   4. The publish job tests that exact commit, then STAGES the version on npm.
#      Nothing is installable yet.
#   5. You approve the staged version with two-factor authentication:
#        npm stage list om-pi-todo
#        npm stage approve <stage-id>
#      or use the Staged tab at https://www.npmjs.com/package/om-pi-todo
#
# No npm token exists. npm trusts this workflow file through OIDC (trusted publishing).
# Publishing happens in this run, not in a tag-push workflow, because a tag made by
# Release Please does not start other workflows.
#
# Switched on by the repository variable RELEASE_PLEASE_ENABLED=true, after the one-time
# setup in README.md (GitHub App secrets, npm trusted publisher, npm-publish environment).
on:
  push:
    branches:
      - main

# Each job asks for what it needs. The default for the workflow is read-only.
permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  release-please:
    name: Release pull request
    if: ${{ vars.RELEASE_PLEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      # The tagged commit. A release made on a later run can belong to an older push.
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A GitHub App token, not GITHUB_TOKEN, so the release pull request starts the CI checks.
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Test and stage on npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment is limited to the main branch. npm trusts it by name.
    environment: npm-publish
    permissions:
      contents: write # add the approval note to the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted publishing and `npm stage` need npm 11.15 or later.
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Stop early on a placeholder version, or a package.json that does not match the release.
      - name: Check the version
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "${PACKAGE_VERSION}" = "0.0.0" ]; then
            echo "package.json still has the placeholder version 0.0.0."
            exit 1
          fi
          if [ "${PACKAGE_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "package.json version ${PACKAGE_VERSION} does not match release ${RELEASE_VERSION}."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Pi host packages
        run: bun run setup:host

      - name: Install OpenSpec CLI
        run: npm install --global --no-audit --no-fund @fission-ai/openspec@1.13.1

      - name: Run the full gate
        run: bun run ci

      # No token: npm authenticates this workflow through OIDC. The version waits in the
      # Staged tab on npm until the maintainer approves it with 2FA.
      - name: Stage on npm
        run: npm stage publish --access public

      - name: Add the approval steps to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > notes.md
          {
            echo
            echo "---"
            echo
            echo "**npm:** \`om-pi-todo@${RELEASE_VERSION}\` is staged and not yet installable."
            echo "Approve it with 2FA in the Staged tab at https://www.npmjs.com/package/om-pi-todo,"
            echo "or run \`npm stage list om-pi-todo\`, then \`npm stage approve <stage-id>\`."
            echo "To try it first: \`npm stage download <stage-id>\` and install the tarball."
          } >> notes.md
          gh release edit "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --notes-file notes.md
