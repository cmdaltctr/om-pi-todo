name: Release

# How a release happens:
#   1. You merge work to main with Conventional Commit messages (feat:, fix:, ...).
#   2. Release Please opens or updates a release pull request. It bumps the version
#      in package.json and writes CHANGELOG.md.
#   3. You review and merge that pull request.
#   4. Release Please tags the commit and creates a GitHub release.
#   5. The publish job below tests the tag and publishes it to npm with provenance.
#
# One-time setup:
#   - Add an npm automation token as the repository secret NPM_TOKEN.
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve
#     pull requests" must be on.
on:
  push:
    branches:
      - main

# Each job asks for its own permissions. Nothing is granted for the whole workflow.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Test and publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Stop early on a placeholder version, or a tag that does not name the version in package.json.
      - name: Check the version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${version}" = "0.0.0" ]; then
            echo "package.json still has the placeholder version 0.0.0."
            exit 1
          fi
          if [ "${TAG}" != "v${version}" ]; then
            echo "Tag ${TAG} does not match package.json version ${version}."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Pi host packages
        run: bun run setup:host

      - name: Install OpenSpec CLI
        run: npm install --global --no-audit --no-fund @fission-ai/openspec@1.13.1

      - name: Run the full gate
        run: bun run ci

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
