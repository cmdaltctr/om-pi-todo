name: Release

# Publishes to npm when you push a version tag such as v0.1.0.
# One-time setup: add an npm automation token as the repository secret NPM_TOKEN.
on:
  push:
    tags:
      - "v*.*.*"

# Provenance needs an OIDC token. Nothing here can write to the repository.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      # Stop a mismatch early: a tag must name the version in package.json.
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Pi host packages
        run: bun run setup:host

      - name: Install OpenSpec CLI
        run: npm install --global --no-audit --no-fund @fission-ai/openspec@1.13.1

      - name: Run the full gate
        run: bun run ci

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
